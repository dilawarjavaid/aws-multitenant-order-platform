name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: order_platform_test
      RUN_DB_TESTS: "true"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: order_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: order_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_admin -d order_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration consistency
        run: python -m alembic check

      - name: Run all tests
        run: python -m pytest -q